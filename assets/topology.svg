<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<!-- TOPOLOGY. To flip a status: change the group class (k-next -> k-live) and the chip text. Chips are a uniform width. -->
<title id="t">System topology of the vertical AI stack</title><desc id="d">Tigrigna text flows into the L3 BPE tokenizer, token IDs into the L4 transformer which runs on the L1 autograd engine, logits into the L5 async server which retrieves context from the L2 vector store and streams tokens.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="58%" r="80%"><stop offset="0" stop-color="#0e3d24"/><stop offset=".6" stop-color="#072214"/><stop offset="1" stop-color="#03100a"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2bd979" fill-opacity=".13"/></pattern>
<linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f8f55" stop-opacity=".24"/><stop offset="1" stop-color="#0b3a22" stop-opacity=".10"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3dff8f"/></marker>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#e8fff1}
.m{font-family:Consolas,'SF Mono','Cascadia Code',Menlo,monospace}
.e{font-family:Nyala,Kefa,'Noto Sans Ethiopic','Abyssinica SIL',sans-serif}
.mut{fill:#86d1a4}
.box{fill:url(#cardfill);stroke-width:1.4}
.accent{fill:none;stroke-width:2.6;stroke-linecap:round}
.chip-bg{stroke-width:1}
.chip-tx{font-family:Consolas,'SF Mono','Cascadia Code',Menlo,monospace;font-size:9px;letter-spacing:1.4px;font-weight:700;text-anchor:middle}
.k-live .box{stroke:#1fbf6a}
.k-live .accent{stroke:#3dff8f}
.k-live .chip-bg{stroke:#3dff8f;fill:#0c3a22}
.k-live .chip-tx{fill:#3dff8f}
.k-next .box{stroke:#ffc24b;stroke-dasharray:5 4}
.k-next .accent{stroke:#ffc24b}
.k-next .chip-bg{stroke:#ffc24b;fill:#2e2408}
.k-next .chip-tx{fill:#ffc24b}
.k-planned .box{stroke:#7d9a8a;stroke-dasharray:5 4}
.k-planned .accent{stroke:#7d9a8a}
.k-planned .chip-bg{stroke:#7d9a8a;fill:#14231b}
.k-planned .chip-tx{fill:#7d9a8a}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes ring{0%,100%{stroke-opacity:.3}50%{stroke-opacity:1}}
.flow{stroke-dasharray:4 8;animation:flow 1.6s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.k-next .box{animation:ring 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.k-next .box{animation:none}}
</style>
</defs>

<rect width="900" height="330" rx="18" fill="url(#bg)"/><rect width="900" height="330" rx="18" fill="url(#dots)"/><rect x=".75" y=".75" width="898.5" height="328.5" rx="17" fill="none" stroke="#1f8f55" stroke-opacity=".5"/><g fill="none" stroke="#3dff8f" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"><path d="M12 46 V20 Q12 12 20 12 H46"/><path d="M854 12 H880 Q888 12 888 20 V46"/><path d="M12 284 V310 Q12 318 20 318 H46"/><path d="M854 318 H880 Q888 318 888 310 V284"/></g>
<text class="m mut" x="44" y="46" font-size="10" letter-spacing="4">SYSTEM TOPOLOGY</text>
<circle cx="784" cy="42.5" r="3.5" fill="#7d9a8a"/><text class="m mut" x="856" y="46" font-size="9.5" letter-spacing="1.4" text-anchor="end">PLANNED</text>
<circle cx="716" cy="42.5" r="3.5" fill="#ffc24b"/><text class="m mut" x="764" y="46" font-size="9.5" letter-spacing="1.4" text-anchor="end">NEXT</text>
<circle cx="648" cy="42.5" r="3.5" fill="#3dff8f"/><text class="m mut" x="696" y="46" font-size="9.5" letter-spacing="1.4" text-anchor="end">LIVE</text>
<rect class="box" x="16" y="102" width="70" height="44" rx="22" style="stroke:#2a7f55"/><text class="m" x="51" y="121" text-anchor="middle" font-size="9.5" letter-spacing="1.2">TIGRIGNA</text><text class="m" x="51" y="134" text-anchor="middle" font-size="9.5" letter-spacing="1.2">TEXT</text>
<path class="flow" d="M88 124 H116" stroke="#3dff8f" stroke-width="1.7" fill="none" marker-end="url(#arr)"/><circle r="3" fill="#fff" filter="url(#glow)"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite" path="M88 124 H116"/></circle>
<g id="L3" class="k-live"><rect class="box" x="120" y="84" width="160" height="80" rx="10"/><path class="accent" d="M132 84 H268" filter="url(#glow)"/><text class="m mut" x="132" y="106" font-size="10" letter-spacing="1.6">L3</text><rect class="chip-bg" x="206" y="92" width="62" height="16" rx="8"/><text class="chip-tx" x="237" y="103.5">LIVE</text><text x="132" y="130" font-size="12.5" font-weight="700" letter-spacing="1.2" filter="url(#glow)">BPE TOKENIZER</text><text class="m mut" x="132" y="148" font-size="9.5">BPE-Tokenizer</text></g>
<path class="flow" d="M282 124 H358" stroke="#3dff8f" stroke-width="1.7" fill="none" marker-end="url(#arr)"/><circle r="3" fill="#fff" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite" path="M282 124 H358"/></circle>
<text class="m mut" x="320" y="114" text-anchor="middle" font-size="9" letter-spacing="1">token ids</text>
<g id="L4" class="k-next"><rect class="box" x="360" y="84" width="160" height="80" rx="10"/><path class="accent" d="M372 84 H508" filter="url(#glow)"/><text class="m mut" x="372" y="106" font-size="10" letter-spacing="1.6">L4</text><rect class="chip-bg" x="446" y="92" width="62" height="16" rx="8"/><text class="chip-tx" x="477" y="103.5">NEXT</text><text x="372" y="130" font-size="12.5" font-weight="700" letter-spacing="1.2" filter="url(#glow)">TRANSFORMER</text><text class="m mut" x="372" y="148" font-size="9.5">repo: pending</text></g>
<path class="flow" d="M522 124 H598" stroke="#3dff8f" stroke-width="1.7" fill="none" marker-end="url(#arr)"/><circle r="3" fill="#fff" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite" path="M522 124 H598"/></circle>
<text class="m mut" x="560" y="114" text-anchor="middle" font-size="9" letter-spacing="1">logits</text>
<g id="L5" class="k-planned"><rect class="box" x="600" y="84" width="160" height="80" rx="10"/><path class="accent" d="M612 84 H748" filter="url(#glow)"/><text class="m mut" x="612" y="106" font-size="10" letter-spacing="1.6">L5</text><rect class="chip-bg" x="686" y="92" width="62" height="16" rx="8"/><text class="chip-tx" x="717" y="103.5">PLANNED</text><text x="612" y="130" font-size="12.5" font-weight="700" letter-spacing="1.2" filter="url(#glow)">ASYNC SERVER</text><text class="m mut" x="612" y="148" font-size="9.5">repo: pending</text></g>
<path class="flow" d="M762 124 H796" stroke="#3dff8f" stroke-width="1.7" fill="none" marker-end="url(#arr)"/><circle r="3" fill="#fff" filter="url(#glow)"><animateMotion dur="1.2s" begin="0.9s" repeatCount="indefinite" path="M762 124 H796"/></circle>
<rect class="box" x="798" y="102" width="86" height="44" rx="22" style="stroke:#2a7f55"/><text class="m" x="841" y="121" text-anchor="middle" font-size="9.5" letter-spacing="1.2">TOKEN</text><text class="m" x="841" y="134" text-anchor="middle" font-size="9.5" letter-spacing="1.2">STREAM</text>
<g id="L1" class="k-live"><rect class="box" x="360" y="218" width="160" height="76" rx="10"/><path class="accent" d="M372 218 H508" filter="url(#glow)"/><text class="m mut" x="372" y="240" font-size="10" letter-spacing="1.6">L1</text><rect class="chip-bg" x="446" y="226" width="62" height="16" rx="8"/><text class="chip-tx" x="477" y="237.5">LIVE</text><text x="372" y="264" font-size="12.5" font-weight="700" letter-spacing="1.2" filter="url(#glow)">TENSOR ENGINE</text><text class="m mut" x="372" y="282" font-size="9.5">tensor-engine-autograd</text></g>
<path class="flow" d="M440 216 V168" stroke="#3dff8f" stroke-width="1.7" fill="none" marker-end="url(#arr)"/><circle r="3" fill="#fff" filter="url(#glow)"><animateMotion dur="1.8s" begin="0.2s" repeatCount="indefinite" path="M440 216 V168"/></circle>
<text class="m mut" x="450" y="196" font-size="9" letter-spacing="1">runs on</text>
<g id="L2" class="k-live"><rect class="box" x="600" y="218" width="160" height="76" rx="10"/><path class="accent" d="M612 218 H748" filter="url(#glow)"/><text class="m mut" x="612" y="240" font-size="10" letter-spacing="1.6">L2</text><rect class="chip-bg" x="686" y="226" width="62" height="16" rx="8"/><text class="chip-tx" x="717" y="237.5">LIVE</text><text x="612" y="264" font-size="12.5" font-weight="700" letter-spacing="1.2" filter="url(#glow)">VECTOR STORE</text><text class="m mut" x="612" y="282" font-size="9.5">vector-retrieval-engine</text></g>
<path class="flow" d="M680 216 V168" stroke="#3dff8f" stroke-width="1.7" fill="none" marker-end="url(#arr)"/><circle r="3" fill="#fff" filter="url(#glow)"><animateMotion dur="2.0s" begin="0.5s" repeatCount="indefinite" path="M680 216 V168"/></circle>
<text class="m mut" x="690" y="196" font-size="9" letter-spacing="1">retrieval</text>
<text class="m mut" x="44" y="222" font-size="9" letter-spacing="3">HOW TO READ IT</text>
<text class="mut" x="44" y="242" font-size="11">Text becomes token IDs (L3). The</text>
<text class="mut" x="44" y="258" font-size="11">Transformer (L4) runs on the L1</text>
<text class="mut" x="44" y="274" font-size="11">autograd engine. The server (L5)</text>
<text class="mut" x="44" y="290" font-size="11">streams tokens and pulls context</text>
<text class="mut" x="44" y="306" font-size="11">from the L2 vector store.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>